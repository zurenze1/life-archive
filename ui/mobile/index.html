<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121310"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/mobile.css"><title>人生档案 · 随手记</title></head><body><header><a href="/">人生档案 <small>随手记</small></a><span id="connection">正在连接…</span></header><main><p class="eyebrow">留住一闪而过的念头</p><h1>想到什么，<br><em>先留下来。</em></h1><p class="intro">在手机记，回电脑继续。<br>原话保留，自动记下此刻。</p><label>标题（可留空）<input id="title" maxlength="200" placeholder="给这个念头起个名字"></label><textarea id="text" placeholder="今天的想法、读书收获、创作灵感……也可以点击键盘上的麦克风，用语音输入。" aria-label="想留下的话"></textarea><div class="actions"><button id="record">● 直接录音</button><label class="file-button">导入 / 录制声音<input id="audio" type="file" accept="audio/*" capture></label><span id="record-status"></span></div><audio id="playback" controls hidden></audio><button class="primary" id="save">留下这个念头 →</button><p id="message" role="status"></p><section class="panel"><div class="section-head"><h2>我的随手记</h2><button id="sync">立即同步</button></div><p class="hint">先保存到本机。页面打开且连接电脑时，每 15 秒补传；后台自动运行由安卓系统决定。</p><div id="notes"></div></section><details class="panel"><summary>连接与离线使用</summary><p id="offline-info"></p><p>外出即时同步：电脑和安卓加入同一 Tailscale 私人网络，电脑用 Tailscale Serve 提供本页面的 HTTPS 地址。首次在联网时打开并添加到主屏幕，之后可离线记录。</p><p>普通 Wi‑Fi 地址没有 HTTPS，不能保证断网后重新打开；可以使用安卓键盘语音输入或“导入声音”。密码和重要信息保险箱不开放给手机。</p><label>配对密钥<input id="pair" type="password" autocomplete="off" placeholder="首次使用电脑配对链接自动填入"></label><button id="pair-save">连接这台电脑</button><button id="download">导出手机未丢失备份</button></details></main><script src="/mobile.js"></script></body></html>
